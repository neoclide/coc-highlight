name: Daily release

on:
  schedule:
    # GitHub Actions cron uses UTC. Run daily away from the top of the hour.
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install editors
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim vim

      - name: Download coc.nvim release branch
        shell: bash
        run: |
          set -euo pipefail

          archive="$(mktemp "${RUNNER_TEMP}/coc.nvim.release.XXXXXX")"
          coc_path="$(mktemp -d "${RUNNER_TEMP}/coc.nvim.release.XXXXXX")"
          trap 'rm -f "$archive"; rm -rf "$coc_path"' EXIT

          curl --fail --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output "$archive" \
            https://api.github.com/repos/neoclide/coc.nvim/tarball/release
          tar -xzf "$archive" --strip-components=1 -C "$coc_path"
          printf 'COC_TEST_COC_PATH=%s\n' "$coc_path" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Test with Neovim
        run: npm run test

      - name: Test with Vim
        run: npm run test:vim

      - name: Plan release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          current_version="$(node -p "require('./package.json').version")"

          # Use the newest reachable SemVer release tag as the baseline. Keep
          # the original tag for Git operations and strip a leading "v" only
          # when comparing it with package.json.
          previous_tag="$(
            git tag --list |
              awk '/^v?[0-9]+\.[0-9]+\.[0-9]+$/ { version = $0; sub(/^v/, "", version); printf "%s\t%s\n", version, $0 }' |
              sort -V |
              tail -n 1 |
              cut -f 2
          )"
          if [[ -z "$previous_tag" ]]; then
            echo "::error::No SemVer release tag found; create the baseline release tag before running this workflow"
            exit 1
          fi
          previous_version="${previous_tag#v}"

          if ! git merge-base --is-ancestor "$previous_tag" HEAD; then
            echo "::error::Release tag ${previous_tag} is not an ancestor of HEAD"
            exit 1
          fi

          if [[ "$current_version" != "$previous_version" ]]; then
            if [[ "$(printf '%s\n%s\n' "$current_version" "$previous_version" | sort -V | tail -n 1)" != "$current_version" ]]; then
              echo "::error::package.json version ${current_version} is older than latest release tag ${previous_tag}"
              exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/${current_version}^{commit}" >/dev/null; then
              echo "::error::Release tag ${current_version} already exists; inspect remote branch/tag divergence"
              exit 1
            fi
            echo "Manifest version ${current_version} is newer than tag ${previous_tag}; releasing the bumped version directly."
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${current_version}" >> "$GITHUB_OUTPUT"
            echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_count="$(git rev-list --count "${previous_tag}..HEAD")"
          if [[ "$commit_count" == "0" ]]; then
            if npm view "${package_name}@${current_version}" version --json >/dev/null 2>&1; then
              echo "No commits since ${previous_tag}; nothing to release."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Git release ${current_version} exists but npm does not have it; retrying publication only."
            echo "mode=publish-only" >> "$GITHUB_OUTPUT"
            echo "version=${current_version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published_version="$(npm view "$package_name" version)"
          if [[ "$published_version" != "$current_version" ]]; then
            echo "::error::package.json version ${current_version} does not match npm latest ${published_version}"
            exit 1
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Update version and history
        if: steps.release.outputs.mode == 'release'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="${{ steps.release.outputs.previous_tag }}"
          if [[ -n "${{ steps.release.outputs.version }}" ]]; then
            version="${{ steps.release.outputs.version }}"
          else
            version="$(npm version patch --no-git-tag-version)"
          fi
          version="${version#v}"

          if git rev-parse --verify --quiet "refs/tags/${version}^{commit}" >/dev/null; then
            echo "::error::Release tag ${version} already exists; inspect remote branch/tag divergence"
            exit 1
          fi

          release_notes="$(mktemp "${RUNNER_TEMP}/release-notes.XXXXXX")"
          updated_history="$(mktemp "${RUNNER_TEMP}/history-update.XXXXXX")"
          trap 'rm -f "$release_notes" "$updated_history"' EXIT
          git log --format='- %s (%h)' "${previous_tag}..HEAD" > "$release_notes"
          {
            printf '## %s\n\n' "$version"
            cat "$release_notes"
            if [[ -s history.md ]]; then
              printf '\n'
              cat history.md
            fi
          } > "$updated_history"
          mv "$updated_history" history.md

          npm pack --dry-run

          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            echo "::error::git commit -a would omit untracked files:"
            printf '%s\n' "$untracked"
            exit 1
          fi

          git diff --check
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: steps.release.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.prepare.outputs.version }}"
          default_branch="${{ github.event.repository.default_branch }}"
          source_head="$(git rev-parse HEAD)"
          git fetch --quiet origin "$default_branch"
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_head" != "$source_head" ]]; then
            echo "::error::Default branch advanced during this run; retry from ${remote_head}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -m "Release $version"
          git tag -a "$version" -m "Release $version"
          git push --tags
          if ! git push; then
            echo "::error::Release tag ${version} was pushed, but ${default_branch} was not; repair the remote divergence manually before rerunning"
            exit 1
          fi

      - name: Publish to npm
        if: steps.release.outputs.mode == 'release' || steps.release.outputs.mode == 'publish-only'
        run: npm publish
